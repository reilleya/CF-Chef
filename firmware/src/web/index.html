<!DOCTYPE html>
<html lang="en">
<head>
    <script src="buttons.js"></script>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oven Control</title>
</head>
<body>
    <main>
        <form id="configForm" style="display: flex; flex-flow: column nowrap; align-items: center;">
            <div id="scheduleSection">
                <table id="scheduleTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Type</th>
                            <th>Duration (s)</th>
                            <th>Temperature (°C)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
                <div id="scheduleActions">
                    <button type="button" id="addStepBtn">Add Step</button>
                    <span id="stepCount">0 / 32 steps</span>
                </div>
            </div>
            <label>T1: <input name="use_t1" type="checkbox"> Offset: <input name="t1_offset" type="number" value="0" style="width:4em"> °C</label>
            <label>T2: <input name="use_t2" type="checkbox"> Offset: <input name="t2_offset" type="number" value="0" style="width:4em"> °C</label>
            <label>T3: <input name="use_t3" type="checkbox"> Offset: <input name="t3_offset" type="number" value="0" style="width:4em"> °C</label>
            <label>Use Fan 1: <input name="use_fan1" type="checkbox"></label>
            <label>Use Fan 2: <input name="use_fan2" type="checkbox"></label>
            <input type="submit" value="Start Run">
        </form>

        <div id="statusBox">
            <div class="status-title">Status</div>
            <div class="status-row">
                <span class="status-label">State</span>
                <span id="machineState" class="status-value">—</span>
            </div>
            <div class="status-row">
                <span class="status-label">Temperature / Setpoint</span>
                <span id="tempReadout" class="status-value">— / — °C</span>
            </div>
            <div class="status-row">
                <span class="status-label">Time</span>
                <span id="timeReadout" class="status-value">— / — s</span>
            </div>
            <div class="status-section-label">Thermocouples</div>
            <div class="status-row">
                <span class="status-label">Zone 1</span>
                <span class="status-value"><span id="zone1Temp">—</span> &middot; <span id="zone1Fault">—</span></span>
            </div>
            <div class="status-row">
                <span class="status-label">Zone 2</span>
                <span class="status-value"><span id="zone2Temp">—</span> &middot; <span id="zone2Fault">—</span></span>
            </div>
            <div class="status-row">
                <span class="status-label">Zone 3</span>
                <span class="status-value"><span id="zone3Temp">—</span> &middot; <span id="zone3Fault">—</span></span>
            </div>
            <div class="status-section-label">Fans</div>
            <div class="status-row">
                <span class="status-label">Fan 1</span>
                <span class="status-value"><span id="fan1Speed">—</span> &middot; <span id="fan1Fault">—</span></span>
            </div>
            <div class="status-row">
                <span class="status-label">Fan 2</span>
                <span class="status-value"><span id="fan2Speed">—</span> &middot; <span id="fan2Fault">—</span></span>
            </div>
        </div>
    </main>
</body>
</html>
