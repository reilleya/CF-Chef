<!DOCTYPE html>
<html lang="en">
<head>
    <script src="buttons.js"></script>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oven Control</title>
</head>
<body>
    <main>
        <form id="configForm" style="display: flex; flex-flow: column nowrap; align-items: center;">
            <label>Temperature (°C): <input name="temperature" type="number"></label>
            <label>Time (Seconds): <input name="time" type="number"></label>
            <label>Use T0: <input name="use_t0" type="checkbox"></label>
            <label>Use T1: <input name="use_t1" type="checkbox"></label>
            <label>Use T2: <input name="use_t2" type="checkbox"></label>
            <input type="submit" value="Start Run">
        </form>

        <table id="readoutTable">
            <tr>
                <th>Zone 1</th>
                <th>Zone 2</th>
                <th>Zone 3</th>
            </tr>
            <tr>
                <td id="zone1Temp">0 °C</td>
                <td id="zone2Temp">0 °C</td>
                <td id="zone3Temp">0 °C</td>
            </tr>
        </table>

        <h1 id="readout">Current/Setpoint °C for TIME</h1>
    </main>
</body>
</html>
