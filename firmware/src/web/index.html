<!DOCTYPE html>
<html lang="en">
<head>
    <script src="buttons.js"></script>
    <link rel="stylesheet" href="styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oven Control</title>
</head>
<body>
    <main>
        <form id="configForm" style="display: flex; flex-flow: column nowrap; align-items: center;">
            <div id="scheduleSection">
                <table id="scheduleTable">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Type</th>
                            <th>Duration (s)</th>
                            <th>Temperature (°C)</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody"></tbody>
                </table>
                <div id="scheduleActions">
                    <button type="button" id="addHoldBtn">Add Hold</button>
                    <button type="button" id="addRampBtn">Add Ramp</button>
                    <span id="stepCount">0 / 32 steps</span>
                </div>
            </div>
            <label>Use T1: <input name="use_t1" type="checkbox"></label>
            <label>Use T2: <input name="use_t2" type="checkbox"></label>
            <label>Use T3: <input name="use_t3" type="checkbox"></label>
            <label>Use Fan 1: <input name="use_fan1" type="checkbox"></label>
            <label>Use Fan 2: <input name="use_fan2" type="checkbox"></label>
            <input type="submit" value="Start Run">
        </form>

        <table id="tempReadoutTable">
            <tr>
                <th>Zone 1</th>
                <th>Zone 2</th>
                <th>Zone 3</th>
            </tr>
            <tr>
                <td id="zone1Temp">0 °C</td>
                <td id="zone2Temp">0 °C</td>
                <td id="zone3Temp">0 °C</td>
            </tr>
            <tr>
                <td id="zone1Fault">Fault: Yes</td>
                <td id="zone2Fault">Fault: Yes</td>
                <td id="zone3Fault">Fault: Yes</td>
            </tr>
        </table>

        <table id="fanReadoutTable">
            <tr>
                <th>Fan 1</th>
                <th>Fan 2</th>
            </tr>
            <tr>
                <td id="fan1Speed">0 RPM</td>
                <td id="fan2Speed">0 RPM</td>
            </tr>
            <tr>
                <td id="fan1Fault">Fault: Yes</td>
                <td id="fan2Fault">Fault: Yes</td>
            </tr>
        </table>

        <h1 id="readout">Current/Setpoint °C for TIME</h1>
    </main>
</body>
</html>
